[package]
name = "pyvectorhound"
version = "1.2.1"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Proprietary"
description = "Vector search diagnostics engine for RAG/LLM systems"

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "_core"
crate-type = ["cdylib"]
